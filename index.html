      body { background: #0B0E11; font-family: ${i}; color: #F2F4F6; }
      ::-webkit-scrollbar { width: 6px; }

      @keyframes pulse-ring { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

      @keyframes teal-glow { 0%,100%{box-shadow:0 0 0 0 rgba(47,217,168,0.25);} 70%{box-shadow:0 0 0 20px rgba(47,217,168,0);} }
      .page-enter { animation: slide-in 0.22s ease both; }
      .heartbeat  { animation: heartbeat 1.8s ease-in-out infinite; }
      .rec-pulse  { animation: rec-pulse 1.5s ease-in-out infinite; }
      .teal-glow  { animation: teal-glow 2.2s ease-in-out infinite; }
      .spin       { animation: spin 0.9s linear infinite; }
      input, select, textarea { font-family: ${i}; }
      button { font-family: ${i}; color: inherit; }
      @media (max-width: 760px) {
        .sidebar-d { display: none !important; }
        .mobile-nav { display: flex !important; }
        .main-pad { padding: 20px 16px 90px !important; }
        .two-col { grid-template-columns: 1fr !important; }
      }
      .mobile-nav { display: none; position: fixed; bottom:0; left:0; right:0; z-index:200; }
